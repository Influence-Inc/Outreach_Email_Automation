<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content Brief &amp; Guidelines — INFLUENCE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <style>
    /* Same design tokens as contract.html / offer.html — the brief page is the
       third leg of the creator-facing document set and should read as one
       system, not a one-off. */
    :root {
      --bg: #f5f4f0; --surface: #ffffff; --surface-2: #faf9f6; --surface-3: #f2f0eb;
      --ink: #191817; --ink-2: #4d4b46; --muted: #8a8880; --faint: #a3a19b; --faint-2: #b4b2ac;
      --line: #e6e4de; --line-2: #dcdad3; --line-3: #eeece6;
      --accent: #191817; --accent-strong: #000000;
      --link: #2451d6; --link-strong: #1638a3;
      --green: #147a52; --green-bg: #e7f2ec; --green-line: #cfe6da;
      --radius: 16px; --radius-sm: 10px; --radius-xs: 8px;
      --shadow-card: 0 6px 24px rgba(20,18,15,.06);
      --font: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font); color: var(--ink); background: var(--bg);
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; line-height: 1.6;
    }
    a { color: var(--link); text-decoration: none; word-break: break-word; }
    a:hover { color: var(--link-strong); text-decoration: underline; }
    .num { font-variant-numeric: tabular-nums; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 44px 20px 90px; }

    /* Brand mark — the real INFLUENCE wordmark (same SVG as the contract page),
       always visible above loading / not-found / the loaded brief alike. */
    .brandbar { margin-bottom: 30px; }
    .brandbar svg { height: 22px; width: auto; fill: var(--ink); display: block; }

    .doc {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow-card); padding: 44px 46px 54px;
    }
    h1 { font-size: 29px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 8px; text-wrap: balance; }
    .prepared { color: var(--muted); font-size: 13.5px; margin: 0 0 4px; }
    .for { color: var(--ink-2); font-size: 14px; margin: 0; }

    .callout {
      background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 18px 20px; margin: 26px 0;
    }
    .callout .c-title {
      font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
      color: var(--faint); margin-bottom: 12px;
    }
    .kv { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
    .kv li { font-size: 14.5px; color: var(--ink-2); }
    .kv li b { color: var(--ink); font-weight: 650; }

    .views { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .views .big { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -.01em; }
    .views .sub { color: var(--muted); font-size: 13.5px; }

    section.blk { margin: 30px 0; }
    section.blk > h2 {
      font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--faint); margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
    }
    .lead-in { font-size: 15px; color: var(--ink-2); margin: 0 0 10px; }
    .prose { font-size: 15px; color: var(--ink-2); white-space: pre-wrap; margin: 0; }
    .rules { background: var(--surface-3); border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 16px 18px; font-size: 14.5px; color: var(--ink-2); white-space: pre-wrap; }

    .checklist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .checklist > li {
      display: grid; grid-template-columns: 20px 1fr; gap: 12px; align-items: start;
      font-size: 14.5px; color: var(--ink-2);
    }
    .checklist .box {
      width: 17px; height: 17px; border: 1.5px solid var(--line-2); border-radius: 5px; margin-top: 3px;
      background: var(--surface);
    }
    .checklist .ci b { color: var(--ink); font-weight: 650; display: block; margin-bottom: 2px; }
    .chip {
      font-family: var(--mono); font-size: 12.5px; background: var(--surface-3); color: var(--ink);
      border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 6px;
    }
    .usage { background: var(--green-bg); border: 1px solid var(--green-line); border-radius: var(--radius-sm);
      padding: 13px 16px; font-size: 14px; color: var(--green); }

    /* Primary CTA — used for the one true "go do this" link (upload for
       review); everything else stays an inline link inside its checklist row. */
    .link-btn {
      display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13.5px;
      color: #fff; background: var(--accent); padding: 10px 16px; border-radius: var(--radius-xs);
      text-decoration: none;
    }
    .link-btn:hover { background: var(--accent-strong); color: #fff; text-decoration: none; }
    .link-btn:after { content: '→'; margin-left: 2px; }

    .foot { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
    .foot b { color: var(--ink-2); }

    .phase-h {
      font-size: 15px; font-weight: 800; letter-spacing: -.01em; color: var(--ink);
      margin: 40px 0 4px; padding-top: 26px; border-top: 1px solid var(--line);
    }
    .media-list { display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }
    .embed { margin: 0; }
    .embed iframe { width: 100%; aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: var(--radius-sm); background: #000; display: block; }
    .embed figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .media-link { font-size: 14.5px; }
    .bullets { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14.5px; }
    .bullets li { margin: 2px 0; }

    .state { max-width: 460px; margin: 60px auto; text-align: center; color: var(--muted); }
    .state h2 { color: var(--ink); font-size: 20px; margin: 0 0 8px; }
    .spinner { width: 26px; height: 26px; border: 3px solid var(--line-2); border-top-color: var(--muted);
      border-radius: 50%; margin: 0 auto 16px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

    @media (max-width: 520px) {
      .wrap { padding: 30px 14px 70px; }
      .doc { padding: 30px 22px 40px; border-radius: var(--radius-sm); }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>

      </svg>
    </div>
    <div id="loading" class="state">
      <div class="spinner"></div>
      <p>Loading your brief…</p>
    </div>
    <div id="notfound" class="state" hidden>
      <h2>Brief not found</h2>
      <p>This link may be incorrect or the brief hasn't been published yet. Please check with your INFLUENCE contact.</p>
    </div>
    <div id="root" class="doc" hidden></div>
  </div>
  <script src="/brief.js"></script>

</html>
