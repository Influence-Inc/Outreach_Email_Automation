<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content Brief &amp; Guidelines — INFLUENCE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    :root {
      --bg: #ffffff; --surface: #ffffff; --surface-2: #faf9f6; --surface-3: #f4f2ee;
      --ink: #191817; --ink-2: #4d4b46; --muted: #8a8880; --faint: #a3a19b; --faint-2: #b8b6b0;
      --line: #e9e7e1; --line-2: #dddbd4;
      --accent: #191817;
      --green: #147a52; --green-bg: #eef6f1; --green-line: #cfe6da;
      --link: #1c1b19;
      --radius: 16px; --radius-md: 12px; --radius-sm: 10px; --radius-xs: 8px;
      --shadow-card: 0 1px 2px rgba(20,18,15,.04);
      --font: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font); color: var(--ink); background: var(--bg);
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; line-height: 1.62;
    }
    a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--line-2); word-break: break-word; }
    a:hover { text-decoration-color: var(--ink); }
    .num { font-variant-numeric: tabular-nums; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 46px 22px 96px; }

    /* Masthead */
    .masthead { text-align: center; padding-bottom: 26px; margin-bottom: 30px; border-bottom: 1px solid var(--line); }
    .brandbar svg { height: 21px; width: auto; fill: var(--ink); }

    h1 { font-size: 27px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 6px; line-height: 1.15; }
    .prepared { color: var(--muted); font-size: 13.5px; margin: 0; }
    .for { color: var(--ink-2); font-size: 14px; font-weight: 500; margin: 4px 0 0; }

    /* Callouts (quick info / expected views) */
    .callout {
      background: var(--surface-2); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 18px 20px; margin: 26px 0;
    }
    .c-title {
      font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 13px;
    }
    .kv { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .kv li { font-size: 14.5px; color: var(--ink-2); }
    .kv li b { color: var(--ink); font-weight: 600; }

    .views { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .views .big { font-size: 23px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
    .views .sub { color: var(--muted); font-size: 13px; }

    /* Phase headers + sections */
    .phase-h {
      font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      color: var(--ink); margin: 40px 0 2px; padding-bottom: 10px; border-bottom: 2px solid var(--ink);
    }
    section.blk { margin: 24px 0; }
    section.blk > h2 {
      font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
      color: var(--faint); margin: 0 0 10px;
    }
    .lead-in { font-size: 14.5px; color: var(--muted); margin: 0 0 12px; }
    .prose { font-size: 15px; color: var(--ink-2); white-space: pre-wrap; margin: 0; }
    .rules {
      background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 16px 18px; font-size: 14px; color: var(--ink-2); white-space: pre-wrap;
    }

    /* Media / embeds */
    .media-list { display: flex; flex-direction: column; gap: 16px; margin-top: 4px; }
    .embed { margin: 0; }
    .embed iframe {
      width: 100%; aspect-ratio: 16 / 9; border: 1px solid var(--line-2);
      border-radius: var(--radius-sm); background: var(--surface-3); display: block;
    }
    .embed figcaption { font-size: 13px; color: var(--muted); margin-top: 7px; }
    .media-link {
      font-size: 14.5px; padding: 12px 14px; background: var(--surface-2);
      border: 1px solid var(--line); border-radius: var(--radius-sm);
    }

    .bullets { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14.5px; }
    .bullets li { margin: 3px 0; }

    /* Usage rights */
    .usage {
      background: var(--green-bg); border: 1px solid var(--green-line);
      border-radius: var(--radius-sm); padding: 13px 16px; font-size: 14px; color: var(--green);
    }

    /* After-you-post checklist */
    .checklist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 15px; }
    .checklist > li {
      display: grid; grid-template-columns: 20px 1fr; gap: 13px; align-items: start;
      font-size: 14.5px; color: var(--ink-2);
    }
    .checklist .box { width: 17px; height: 17px; border: 1.5px solid var(--line-2); border-radius: 5px; margin-top: 3px; background: var(--surface); }
    .checklist .ci b { color: var(--ink); font-weight: 600; display: block; margin-bottom: 2px; }
    .chip {
      font-family: var(--mono); font-size: 12.5px; background: var(--surface-3); color: var(--ink);
      border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 6px; white-space: nowrap;
    }

    .foot { margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
    .foot b { color: var(--ink-2); font-weight: 600; }

    /* States */
    .state { max-width: 460px; margin: 80px auto; text-align: center; color: var(--muted); }
    .state h2 { color: var(--ink); font-size: 20px; margin: 0 0 8px; font-weight: 600; }
    .spinner {
      width: 26px; height: 26px; border: 3px solid var(--line-2); border-top-color: var(--muted);
      border-radius: 50%; margin: 0 auto 16px; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

    @media (max-width: 520px) { .wrap { padding: 34px 18px 76px; } h1 { font-size: 23px; } .brandbar svg { height: 18px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="brandbar">

      </div>
    </header>

    <div id="loading" class="state">
      <div class="spinner"></div>
      <p>Loading your brief…</p>
    </div>
    <div id="notfound" class="state" hidden>
      <h2>Brief not found</h2>
      <p>This link may be incorrect or the brief hasn't been published yet. Please check with your INFLUENCE contact.</p>
    </div>
    <main id="root" hidden></main>
  </div>
  <script src="/brief.js"></script>

</html>
