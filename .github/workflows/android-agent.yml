name: Android agent

# Builds the on-device sourcing agent APK and runs its unit tests.
#
# The point is that nobody needs a local Android toolchain to get an installable
# build: every push produces a downloadable APK artifact. Grab it from the run's
# "Artifacts" section, transfer it to the phone, and sideload it.

on:
  push:
    paths:
      - 'android-agent/**'
      - '.github/workflows/android-agent.yml'
  pull_request:
    paths:
      - 'android-agent/**'
      - '.github/workflows/android-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test + build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-agent

    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is committed so Android Studio imports cleanly; verify
      # it matches a known-good Gradle release rather than trusting the binary.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android-agent

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Covers the two contracts that fail invisibly on a real phone: the
      # dumpUi element shape screenVision.js matches on, and the HTTP envelope
      # the backend's command channel expects.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sourcing-agent-debug-apk
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android-agent/app/build/reports/tests/
          if-no-files-found: ignore
